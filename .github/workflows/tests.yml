name: Tests

on:
  push:
    branches: [ main, 'feature/**', 'support/**' ]
  pull_request:

jobs:
  unit-tests:
    name: "Unit tests with TYPO3 ${{ matrix.typo3-version }} and PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        typo3-version: ['^11.5']
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, intl, zip, json, iconv
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies with TYPO3 ${{ matrix.typo3-version }}
        run: |
          composer require typo3/cms-core:${{ matrix.typo3-version }} typo3/cms-backend:${{ matrix.typo3-version }} --no-update
          composer update --no-progress --prefer-dist
          git checkout composer.json

      - name: Run unit tests
        run: composer test:unit
